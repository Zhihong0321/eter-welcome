<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Invoice — Eter Customer App</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <div class="brand-header">
      <img src="/icons/icon-192.svg" alt="">
      <span class="brand-name">Eter Customer App</span>
    </div>
    <div id="content"><div class="card" style="padding:40px 20px;"><div class="spinner"></div></div></div>
  </div>

  <script src="/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const content = document.getElementById('content');
    const customerId = getQueryParam('customer');
    const invoiceId = getQueryParam('invoice');

    function cumulativeMilestones(schedule) {
      let cum = 0;
      return (schedule || []).map((m) => {
        cum += parseFloat(m.percent) || 0;
        return { ...m, cumulative: Math.round(cum * 10) / 10 };
      });
    }

    function suggestedNextAmount(invoice) {
      const milestones = cumulativeMilestones(invoice.payment_schedule);
      const total = invoice.total_amount || 0;
      const percentPaid = total > 0 ? (invoice.paid_amount / total) * 100 : 0;
      const next = milestones.find((m) => m.cumulative > percentPaid + 0.01);
      if (!next) return Math.max(total - invoice.paid_amount, 0);
      return Math.max(((next.cumulative / 100) * total) - invoice.paid_amount, 0);
    }

    function renderMilestoneTrack(invoice) {
      const milestones = cumulativeMilestones(invoice.payment_schedule);
      const total = invoice.total_amount || 0;
      const percent = total > 0 ? Math.min((invoice.paid_amount / total) * 100, 100) : 0;

      const markers = milestones.map((m) => `
        <div class="milestone-marker ${percent >= m.cumulative ? 'reached' : ''}" style="left:${Math.min(m.cumulative, 100)}%;" title="${escapeHtml(m.title)}"></div>
        <div class="milestone-label" style="left:${Math.min(m.cumulative, 100)}%;">${m.cumulative}%</div>
      `).join('');

      return `
        <div class="payment-summary-row">
          <span class="payment-summary-amount">${fmtMoney(invoice.paid_amount)} / ${fmtMoney(invoice.total_amount)}</span>
          <span class="payment-summary-percent">${percent.toFixed(1)}%</span>
        </div>
        <div class="milestone-track">
          <div class="milestone-fill" style="width:${percent}%;"></div>
          ${markers}
        </div>
      `;
    }

    function receiptRow(receipt) {
      return `
        <div class="payment-row">
          <div>
            <div class="payment-amount">${fmtMoney(receipt.amount)}</div>
            <div class="payment-meta">${fmtDate(receipt.payment_date)} · Verified</div>
          </div>
          <a class="btn btn-outline btn-sm" style="width:auto;" href="${receipt.receipt_url}" target="_blank" rel="noopener">Receipt</a>
        </div>
      `;
    }

    function pendingRow(p) {
      return `
        <div class="payment-row">
          <div>
            <div class="payment-amount">${fmtMoney(p.amount)}</div>
            <div class="payment-meta">Submitted ${fmtDate(p.submitted_at)} · Awaiting verification</div>
          </div>
          <span class="badge balance">Pending</span>
        </div>
      `;
    }

    function stepQuotation(invoice) {
      const done = invoice.is_signed;
      return `
        <div class="journey-step">
          <div class="journey-indicator">
            <div class="journey-circle ${done ? 'done' : 'current'}">${done ? '✓' : '1'}</div>
            <div class="journey-line ${done ? 'done' : ''}"></div>
          </div>
          <div class="journey-body">
            <div class="journey-title-row"><span class="journey-title">Sign Quotation</span></div>
            <div class="journey-subtitle">${done ? `Signed on ${fmtDate(invoice.signature_date)}` : 'Review and sign your quotation to get started.'}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn ${done ? 'btn-outline' : 'btn-primary'} btn-sm" style="width:auto;" id="btn-quotation">${done ? 'View Quotation' : 'View &amp; Sign Quotation'}</button>
              <button class="btn btn-outline btn-sm" style="width:auto;" id="btn-printable">Printable Version</button>
            </div>
          </div>
        </div>
      `;
    }

    function stepPayments(invoice) {
      const locked = !invoice.is_signed;
      const fullyPaid = invoice.total_amount > 0 && invoice.balance_due <= 0;
      const circleClass = locked ? '' : (fullyPaid ? 'done' : 'current');
      return `
        <div class="journey-step ${locked ? 'locked' : ''}">
          <div class="journey-indicator">
            <div class="journey-circle ${circleClass}">${fullyPaid ? '✓' : '2'}</div>
            <div class="journey-line ${fullyPaid ? 'done' : ''}"></div>
          </div>
          <div class="journey-body">
            <div class="journey-title-row"><span class="journey-title">Make Payment</span></div>
            ${locked
              ? '<div class="journey-locked-note">Sign your quotation first to unlock payments.</div>'
              : `
                ${renderMilestoneTrack(invoice)}
                <button class="btn btn-primary btn-sm" style="width:auto;" id="btn-submit-payment" ${fullyPaid ? 'disabled' : ''}>${fullyPaid ? 'Fully Paid' : 'Submit Payment'}</button>
                <div id="payments-list" class="payment-list"><div class="spinner"></div></div>
              `}
          </div>
        </div>
      `;
    }

    // Mirrors the 8-item checklist on seda-form.html, so the two pages never
    // disagree about what "documents submitted" means.
    function sedaChecklistItems(d) {
      return [
        { label: 'Applicant Name', done: !!(d.customer_name || '').trim() },
        { label: 'IC Number', done: !!(d.ic_no || '').trim() },
        { label: 'Phone Number', done: !!(d.phone || '').trim() },
        { label: 'Installation Address', done: !!(d.installation_address || '').trim() },
        { label: 'Identity Document', done: !!(d.mykad_pdf || (d.mykad_front && d.mykad_back)) },
        { label: 'TNB Bill', done: !!d.tnb_bill_1 },
        { label: 'Ownership Proof', done: !!d.property_proof },
        { label: 'TNB Meter Photo', done: !!d.tnb_meter }
      ];
    }

    function stepSeda(invoice) {
      const locked = !invoice.is_signed;
      const sedaHref = invoice.seda && invoice.seda.share_token
        ? `seda-form.html?customer=${encodeURIComponent(customerId)}&invoice=${encodeURIComponent(invoice.bubble_id)}&token=${encodeURIComponent(invoice.seda.share_token)}`
        : null;
      const statusLabel = invoice.seda ? (invoice.seda.reg_status || 'Draft') : 'Not started';
      return `
        <div class="journey-step ${locked ? 'locked' : ''}">
          <div class="journey-indicator">
            <div class="journey-circle ${locked ? '' : 'current'}">3</div>
          </div>
          <div class="journey-body">
            <div class="journey-title-row">
              <span class="journey-title">Complete SEDA Registration</span>
              <span class="badge">${escapeHtml(statusLabel)}</span>
            </div>
            ${locked
              ? '<div class="journey-locked-note">Sign your quotation first to unlock this step.</div>'
              : `
                <div class="journey-subtitle">Submit your documents for SEDA/NEM registration.</div>
                ${sedaHref ? '<div id="seda-checklist" style="margin-bottom:12px;"><div class="spinner" style="margin:0;"></div></div>' : ''}
                <button class="btn btn-outline btn-sm" style="width:auto;" id="btn-seda" ${sedaHref ? '' : 'disabled'}>${sedaHref ? 'Continue SEDA Form' : 'Not ready yet'}</button>
              `}
          </div>
        </div>
      `;
    }

    function render(customer, invoice) {
      content.innerHTML = `
        <a class="back-link" href="dashboard.html?customer=${encodeURIComponent(customerId)}">&larr; Back to My Invoices</a>
        <div class="card">
          <h1>${escapeHtml(invoice.invoice_number || invoice.bubble_id)}</h1>
          <p class="subtitle" style="margin-bottom:0;">${escapeHtml(customer.name || '')} · ${fmtDate(invoice.invoice_date)}</p>
        </div>

        <div class="card">
          ${stepQuotation(invoice)}
          ${stepPayments(invoice)}
          ${stepSeda(invoice)}
        </div>
      `;

      document.getElementById('btn-quotation').addEventListener('click', () => {
        window.open(invoice.quotation_url, '_blank', 'noopener');
      });
      document.getElementById('btn-printable').addEventListener('click', () => {
        window.open(invoice.printable_url, '_blank', 'noopener');
      });

      const sedaBtn = document.getElementById('btn-seda');
      if (sedaBtn && !sedaBtn.disabled) {
        const sedaHref = `seda-form.html?customer=${encodeURIComponent(customerId)}&invoice=${encodeURIComponent(invoice.bubble_id)}&token=${encodeURIComponent(invoice.seda.share_token)}`;
        sedaBtn.addEventListener('click', () => { window.location.href = sedaHref; });
      }

      const submitBtn = document.getElementById('btn-submit-payment');
      if (submitBtn) {
        submitBtn.addEventListener('click', () => {
          const suggested = Math.round(suggestedNextAmount(invoice) * 100) / 100;
          window.location.href = `submit-payment.html?customer=${encodeURIComponent(customerId)}&invoice=${encodeURIComponent(invoice.bubble_id)}&suggested=${encodeURIComponent(suggested)}`;
        });
      }

      const sedaChecklistEl = document.getElementById('seda-checklist');
      if (sedaChecklistEl && invoice.seda && invoice.seda.share_token) {
        fetchSedaData(invoice.seda.share_token)
          .then((d) => {
            const items = sedaChecklistItems(d);
            const done = items.filter((i) => i.done).length;
            const pct = Math.round((done / items.length) * 100);
            sedaChecklistEl.innerHTML = `
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              <div class="progress-label" style="margin-bottom:0;">${done}/${items.length} documents submitted</div>
            `;
          })
          .catch(() => { sedaChecklistEl.innerHTML = ''; });
      }

      const paymentsList = document.getElementById('payments-list');
      if (paymentsList) {
        const pendingRows = (invoice.pending_payments || []).map(pendingRow);
        fetchOfficialReceipts(invoice.bubble_id)
          .then((receipts) => {
            const rows = [...receipts.map(receiptRow), ...pendingRows];
            paymentsList.innerHTML = rows.length ? rows.join('') : '<div class="empty-state" style="padding:16px;">No payments yet.</div>';
          })
          .catch(() => {
            paymentsList.innerHTML = pendingRows.length
              ? pendingRows.join('')
              : '<div class="empty-state" style="padding:16px;">Payment history is temporarily unavailable. Your balance above is up to date.</div>';
          });
      }
    }

    (async () => {
      if (!customerId || !invoiceId) {
        showFatalError(content, 'Missing customer or invoice reference.');
        return;
      }
      try {
        const data = await fetchCustomerPortal(customerId);
        const invoice = data.invoices.find((inv) => inv.bubble_id === invoiceId);
        if (!invoice) {
          showFatalError(content, 'That invoice could not be found on this account.', {
            backHref: `dashboard.html?customer=${encodeURIComponent(customerId)}`,
            backLabel: 'Back to My Invoices'
          });
          return;
        }
        render(data.customer, invoice);
      } catch (err) {
        showFatalError(content, 'Something went wrong loading this invoice. Please try again.');
      }
    })();
  </script>
</body>
</html>
